name: Bash CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ✅ Vérification de la syntaxe Bash
      - name: Bash syntax check
        run: bash -n scripts/protect_pro.sh

      # ✅ Installation de ShellCheck
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # ✅ Analyse avec ShellCheck
      - name: ShellCheck lint
        run: shellcheck --severity=style --color=always scripts/protect_pro.sh

      # ✅ Vérification du shebang et droits d'exécution
      - name: Ensure shebang and executable bit
        run: |
          grep -q '^#!/usr/bin/env bash' scripts/protect_pro.sh
          chmod +x scripts/protect_pro.sh

      # ✅ Installation de shfmt
      - name: Install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          go install mvdan.cc/sh/v3/cmd/shfmt@latest

      # ✅ Formatage automatique
      - name: Run shfmt
        run: shfmt -w -i 2 -ci -s scripts/protect_pro.sh

      # ✅ Commit automatique si shfmt modifie le script
      - name: Commit formatted files
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(ci): apply shfmt formatting"
          file_pattern: scripts/protect_pro.sh